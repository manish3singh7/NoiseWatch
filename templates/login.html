<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoiseWatch - Authority Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4 antialiased font-sans">

    <div class="w-full max-w-md bg-slate-900/70 border border-slate-800 p-8 rounded-2xl shadow-2xl backdrop-blur-xl">

        <div class="text-center mb-6">
            <div
                class="w-12 h-12 rounded-xl bg-indigo-600 mx-auto flex items-center justify-center text-white mb-3 shadow-lg shadow-indigo-600/30">
                <i data-lucide="shield-alert" class="w-6 h-6"></i>
            </div>
            <h2 class="text-xl font-bold text-white tracking-tight">Authority Access Only</h2>
            <p class="text-xs text-slate-400 mt-1">Please authenticate with master credentials</p>
        </div>

        {% if error %}
        <div
            class="mb-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-semibold text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
                <input type="text" name="username" required autocomplete="off"
                    class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:border-indigo-500" />
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Master Password</label>
                <input type="password" name="password" required
                    class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:border-indigo-500" />
            </div>

            <button type="submit"
                class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/30">
                Verify & Enter Portal
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">← Return to Citizen
                Dashboard</a>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
