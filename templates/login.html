<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoiseWatch - Authority Authentication</title>
    <!-- Anti-FOUC Theme Initializer -->
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('noisewatch_theme');
                if (savedTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-primary: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
        }

        html.dark {
            --bg-primary: #070b14;
            --card-bg: rgba(13, 20, 36, 0.9);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: rgba(51, 65, 85, 0.8);
            --input-bg: #020617;
        }

        body, div, main, header, footer, a, button, input {
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
    </style>
</head>

<body class="min-h-screen bg-[var(--bg-primary)] text-[var(--text-primary)] flex flex-col justify-between p-4 antialiased font-sans relative selection:bg-indigo-600 selection:text-white">

    <!-- Top Utility Bar -->
    <header class="w-full max-w-5xl mx-auto py-2 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2 group cursor-pointer" aria-label="Return to Citizen Portal">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-600/20 group-hover:bg-indigo-500 transition-colors">
                <i data-lucide="volume-2" class="w-4 h-4"></i>
            </div>
            <span class="font-extrabold text-sm tracking-tight text-[var(--text-primary)] group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">NoiseWatch</span>
        </a>

        <div class="flex items-center gap-3">
            <!-- Theme Toggle Button -->
            <button id="themeToggleBtn" type="button" aria-label="Toggle light or dark theme"
                class="p-2 sm:px-3 sm:py-1.5 rounded-xl border border-[var(--border-color)] bg-[var(--card-bg)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] text-xs font-semibold shadow-sm flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <i id="themeIconSun" data-lucide="sun" class="w-4 h-4 hidden text-amber-500"></i>
                <i id="themeIconMoon" data-lucide="moon" class="w-4 h-4 text-indigo-500 dark:text-indigo-400"></i>
                <span id="themeToggleText">Light</span>
            </button>

            <a href="/" class="text-xs font-semibold text-[var(--text-muted)] hover:text-[var(--text-primary)] transition-colors flex items-center gap-1.5">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                <span>Citizen Portal</span>
            </a>
        </div>
    </header>

    <!-- Authentication Card -->
    <main class="w-full max-w-md mx-auto my-auto bg-[var(--card-bg)] border border-[var(--border-color)] p-6 sm:p-8 rounded-2xl shadow-xl space-y-6">

        <div class="text-center space-y-1.5">
            <div class="w-12 h-12 rounded-xl bg-indigo-600/15 border border-indigo-500/30 mx-auto flex items-center justify-center text-indigo-600 dark:text-indigo-400 mb-3 shadow-lg shadow-indigo-600/20">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <h1 class="text-xl font-extrabold text-[var(--text-primary)] tracking-tight">Authority Access</h1>
            <p class="text-xs text-[var(--text-secondary)]">Authenticate with municipal credentials to access incident logs</p>
        </div>

        {% if error %}
        <div class="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400 text-xs font-semibold text-center flex items-center justify-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-[var(--text-primary)] mb-1.5">Username</label>
                <div class="relative">
                    <input type="text" name="username" required autocomplete="username" placeholder="Enter admin username"
                        class="w-full pl-9 pr-3.5 py-2.5 text-sm bg-[var(--input-bg)] border border-[var(--border-color)] rounded-xl text-[var(--text-primary)] placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all" />
                    <i data-lucide="user" class="w-4 h-4 text-slate-400 dark:text-slate-500 absolute left-3 top-3 pointer-events-none"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-[var(--text-primary)] mb-1.5">Password</label>
                <div class="relative">
                    <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••••••"
                        class="w-full pl-9 pr-3.5 py-2.5 text-sm bg-[var(--input-bg)] border border-[var(--border-color)] rounded-xl text-[var(--text-primary)] placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all" />
                    <i data-lucide="lock" class="w-4 h-4 text-slate-400 dark:text-slate-500 absolute left-3 top-3 pointer-events-none"></i>
                </div>
            </div>

            <button type="submit"
                class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-4 rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i>
                <span>Verify & Enter Portal</span>
            </button>
        </form>

        <div class="pt-4 border-t border-[var(--border-color)] text-center">
            <span class="text-[11px] text-[var(--text-muted)]">Official Municipal & Pollution Control Authority System</span>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-5xl mx-auto py-2 text-center text-xs text-[var(--text-muted)]">
        NoiseWatch • Civic Acoustic Intelligence Platform
    </footer>

    <script>
        lucide.createIcons();

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIconSun = document.getElementById('themeIconSun');
        const themeIconMoon = document.getElementById('themeIconMoon');
        const themeToggleText = document.getElementById('themeToggleText');

        function updateThemeUI(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                if (themeIconSun) themeIconSun.classList.remove('hidden');
                if (themeIconMoon) themeIconMoon.classList.add('hidden');
                if (themeToggleText) themeToggleText.textContent = 'Dark';
            } else {
                document.documentElement.classList.remove('dark');
                if (themeIconSun) themeIconSun.classList.add('hidden');
                if (themeIconMoon) themeIconMoon.classList.remove('hidden');
                if (themeToggleText) themeToggleText.textContent = 'Light';
            }
            lucide.createIcons();
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const newTheme = isDark ? 'light' : 'dark';
            localStorage.setItem('noisewatch_theme', newTheme);
            updateThemeUI(!isDark);
        }

        if (themeToggleBtn) themeToggleBtn.addEventListener('click', toggleTheme);
        updateThemeUI(document.documentElement.classList.contains('dark'));
    </script>
</body>

</html>
